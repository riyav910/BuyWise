services:
  - type: web
    name: buywise-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend/node-server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        value: https://buywise-ce5j.netlify.app
